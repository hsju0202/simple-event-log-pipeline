services:
  db:
    image: postgres:16-alpine
    cpus: 2.0
    mem_limit: 4g
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_simple_event:/var/lib/postgresql/data

  benchmark:
    image: python:3.12-slim
    cpus: 2.0
    mem_limit: 4g
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@db:5432/events
      EVENT_COUNT: "1000000"
      EVENT_SEED: "1"
      WARM_RUNS: "5"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    command:
      - sh
      - -lc
      - |
        pip install --no-cache-dir "psycopg[binary]" &&
        python required/benchmark.py --backend db --count "$${EVENT_COUNT}" --seed "$${EVENT_SEED}" --warm-runs "$${WARM_RUNS}"

volumes:
  postgres_data_simple_event:
