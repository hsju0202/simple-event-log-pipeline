services:
  app:
    image: python:3.12-slim
    cpus: 2.0
    mem_limit: 4g
    working_dir: /app
    environment:
      EVENT_COUNT: "1000000"
      EVENT_SEED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    command:
      - sh
      - -lc
      - |
        pip install --no-cache-dir duckdb pandas pyarrow pytz &&
        python required/main.py --backend file --count "$${EVENT_COUNT}" --seed "$${EVENT_SEED}"
